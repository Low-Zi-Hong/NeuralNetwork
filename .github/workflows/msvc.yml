name: MSVC-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # ⚠️ 关键：必须用 windows-latest，因为只有它装了 Visual Studio
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 寻找 MSBuild.exe (Visual Studio 的核心编译引擎)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Doxygen
      run: sudo apt-get install -y doxygen
    # 2. 运行 Doxygen 生成文档
    - name: Run Doxygen
      run: doxygen Doxyfile
    # 3. 部署到 GitHub Pages (这是最骚的操作，文档直接变网页)
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./html  # Doxygen 默认生成的目录

    # 2. 如果你有用到 NuGet 包（可选）
    - name: Restore NuGet packages
      run: nuget restore NeuralNetwork.sln

    # 3. 核心步骤：编译代码
    - name: Build Solution
      run: |
        msbuild /m /p:Configuration=Release NeuralNetwork.sln